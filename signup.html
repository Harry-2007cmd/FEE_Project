<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your flexform space." />
    <title>Create an account · flexform.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body data-page="signup">
    <div id="app" class="app hidden">
      <main id="pages">
        <section class="page active auth-page" id="page-signup">
          <div class="auth-wrap">
            <a class="brand" href="index.html"
              ><span class="brand-mark">⌁</span><b>flexform<span>.</span></b></a
            >
            <p class="eyebrow">Start with one good choice</p>
            <h1>Make room for feeling good.</h1>
            <p class="lede">
              Your coaches, courses and progress — all in one calm place.
            </p>
            <form class="auth-form" data-auth>
              <label>Your name<input name="name" required placeholder="Alex Lee" /></label
              ><label
                >Email address<input
                  type="email"
                  name="email"
                  required
                  placeholder="you@example.com" /></label
              ><label
                >Password<input
                  type="password"
                  name="password"
                  required
                  minlength="8"
                  placeholder="At least 8 characters" /></label
              ><button class="action-button" type="submit">
                Create my space →
              </button>
            </form>
            <p class="auth-switch">
              Already have a space? <a href="login.html">Sign in</a>
            </p>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="signup.js"></script>
  </body>
</html>
