<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your flexform space." />
    <title>Sign in · flexform.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body data-page="login">
    <div id="app" class="app hidden">
      <main id="pages">
        <section class="page active auth-page" id="page-login">
          <div class="auth-wrap">
            <a class="brand" href="index.html"
              ><span class="brand-mark">⌁</span><b>flexform<span>.</span></b></a
            >
            <p class="eyebrow">Welcome back</p>
            <h1>Let’s pick up where you left off.</h1>
            <p class="lede">
              Sign in to see your plan, upcoming sessions and little wins.
            </p>
            <form class="auth-form" data-auth>
              <label
                >Email address<input
                  type="email"
                  required
                  placeholder="you@example.com" /></label
              ><label
                >Password<input
                  type="password"
                  required
                  minlength="8"
                  placeholder="At least 8 characters" /></label
              ><button class="action-button" type="submit">Sign me in →</button>
            </form>
            <p class="auth-switch">
              New to flexform? <a href="signup.html">Create an account</a>
            </p>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="login.js"></script>
  </body>
</html>
