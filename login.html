<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your flexform space." />
    <title>Sign in · flexform.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body data-page="login">
    <div id="app" class="app hidden">
      <main id="pages">
        <section class="page active auth-page" id="page-login">
          <div class="auth-wrap">
            <a class="brand" href="index.html"
              ><span class="brand-mark">⌁</span><b>flexform<span>.</span></b></a
            >
            <p class="eyebrow">Welcome back</p>
            <h1>Let’s pick up where you left off.</h1>
            <p class="lede">
              Sign in to see your plan, upcoming sessions and little wins.
            </p>
            <form class="auth-form" id="loginForm" novalidate>
              <p class="form-error hidden" id="loginError" role="alert"></p>
              <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" aria-describedby="email-error" />
                <p class="field-error" id="email-error"></p>
              </div>
              <div class="field">
                <label for="password">Password</label>
                <div class="password-field">
                  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" aria-describedby="password-error" />
                  <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
                </div>
                <p class="field-error" id="password-error"></p>
              </div>
              <label class="check-row" for="remember">
                <input id="remember" name="remember" type="checkbox" />
                <span>Remember me for 30 days</span>
              </label>
              <button class="action-button" type="submit" id="loginSubmit">Sign me in →</button>
            </form>
            <p class="auth-switch">
              New to flexform? <a href="signup.html">Create an account</a>
            </p>
            <aside class="demo-hint" aria-label="Demo account">
              <p><b>Demo account</b> · demo@flexform.com / Demo1234</p>
              <button class="link-button" type="button" id="useDemo">Fill it in</button>
            </aside>
          </div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
    <script src="login.js"></script>
  </body>
</html>
