<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="2.5;url=index.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexForm Gym | Loading</title>
    <style>
      :root {
        --card: rgba(17, 18, 19, 0.78);
        --text: #f5f5f5;
        --text-soft: rgba(255, 255, 255, 0.72);
        --accent: #ff4423;
        --line: rgba(255, 255, 255, 0.1);
        --shadow: 0 30px 80px rgba(255, 68, 35, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(255, 102, 61, 0.28), transparent 30%),
          radial-gradient(circle at bottom right, rgba(255, 168, 120, 0.18), transparent 32%),
          linear-gradient(135deg, #111111 0%, #1a1919 28%, #140d0d 100%);
        color: var(--text);
      }

      .loading-screen {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px 16px 18px;
        overflow: hidden;
      }

      .ambient {
        position: absolute;
        border-radius: 50%;
        filter: blur(50px);
        opacity: 0.65;
        pointer-events: none;
      }

      .ambient.one {
        width: 200px;
        height: 200px;
        background: rgba(255, 68, 35, 0.22);
        top: 10%;
        left: 8%;
      }

      .ambient.two {
        width: 220px;
        height: 220px;
        background: rgba(255, 166, 114, 0.2);
        bottom: 7%;
        right: 8%;
      }

      .content {
        position: relative;
        z-index: 2;
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 26px 20px 20px;
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .brand {
        font-size: 1.2rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        margin-bottom: 18px;
      }

      .brand span {
        color: var(--accent);
      }

      .title {
        margin: 0 0 10px;
        font-size: clamp(1.6rem, 8vw, 2.2rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .subtitle {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.92rem;
      }

      .loader-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 26px 0 6px;
      }

      .loader-ring {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--accent);
        border-right-color: #ff9d78;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 28px rgba(255, 68, 35, 0.22);
      }

      .loading-text {
        font-size: 0.76rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-soft);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="loading-screen">
      <div class="ambient one"></div>
      <div class="ambient two"></div>

      <div class="content">
        <div class="brand">FLEX<span>FORM</span></div>
        <h1 class="title">Train harder. Feel stronger.</h1>
        <p class="subtitle">Preparing your workout space...</p>

        <div class="loader-panel">
          <div class="loader-ring" aria-label="Loading"></div>
          <div class="loading-text">Loading</div>
        </div>
      </div>
    </div>
  </body>
</html>
